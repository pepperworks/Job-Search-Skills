<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Search Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&display=swap">
<style>
  /* Two panels: your moves and the full board on warm cream, dates and counts on white.
     Sage green and peach carry status; navy carries the type. Falls back to system fonts offline. */
  :root {
    color-scheme: light;
    --page:#f3e6d6; --cream:#f7f2ea; --white:#ffffff; --rule:#ece5da;
    --ink:#1e2030; --ink-2:#55566a; --muted:#8d8c95;
    --green:#8fb573; --green-ink:#4c7434; --green-tint:#e7f1dd;
    --peach:#f1a36a; --peach-ink:#b25a22; --peach-tint:#fce7d4;
    --sans:"Urbanist","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    --lift:0 10px 24px -18px rgba(30,32,48,.35);
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--sans); background:var(--page); color:var(--ink); font-size:15px; line-height:1.45; font-weight:500;
         padding-block:24px 40px; padding-inline:16px; }
  .shell { max-width:1080px; margin:0 auto; background:var(--cream); border-radius:28px; overflow:hidden;
           display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);
           grid-template-areas:"head side" "main side"; grid-template-rows:auto 1fr; }
  .head { grid-area:head; padding:34px 32px 0; min-width:0; }
  .main { grid-area:main; padding:0 32px 36px; min-width:0; }
  .side { grid-area:side; background:var(--white); padding:34px 28px 36px; min-width:0; }

  .demo { display:inline-block; background:var(--green-tint); color:var(--green-ink); font-size:12px; font-weight:700;
          padding:4px 12px; border-radius:999px; margin-bottom:16px; }
  h1 { font-size:34px; line-height:1.1; font-weight:700; letter-spacing:-0.02em; margin:0; text-wrap:balance; }
  .sub { color:var(--ink-2); margin-top:10px; }
  .srcnote { color:var(--muted); font-size:13px; margin-top:2px; }
  .srcnote b { color:var(--ink-2); font-weight:700; }
  .old { color:var(--peach-ink); font-weight:700; }

  h2 { font-size:18px; font-weight:700; letter-spacing:-0.01em; margin:32px 0 14px; display:flex; align-items:baseline; gap:8px; }
  .side > h2:first-child { margin-top:0; }
  h2 .cnt, summary .cnt { margin-left:auto; font-size:13px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }

  .list { display:flex; flex-direction:column; gap:10px; }
  .task { display:flex; align-items:flex-start; gap:12px; background:var(--white); border-radius:16px; padding:14px 16px;
          box-shadow:var(--lift); cursor:pointer; }
  .task input { appearance:none; -webkit-appearance:none; width:20px; height:20px; margin:1px 0 0; flex:0 0 auto; cursor:pointer;
                border:2px solid #d9d2c5; border-radius:7px; background:var(--white); position:relative; }
  .task input:checked { background:var(--green); border-color:var(--green); }
  .task input:checked::after { content:""; position:absolute; left:5px; top:1px; width:5px; height:10px;
                border:solid var(--white); border-width:0 2.5px 2.5px 0; transform:rotate(42deg); }
  .task input:focus-visible, summary:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .task.done { box-shadow:none; background:transparent; }
  .task.done .t { text-decoration:line-through; color:var(--muted); }

  .body { flex:1; min-width:0; }
  .t { font-weight:700; }
  .t .role { font-weight:500; color:var(--ink-2); }
  .s { font-size:14px; color:var(--ink-2); margin-top:1px; }
  .m { font-size:13px; color:var(--muted); margin-top:2px; }
  .m b { color:var(--peach-ink); font-weight:700; }

  .row { display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--rule); }
  .row:last-child { border-bottom:none; }
  .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; margin-top:7px; background:#cfc8bb; }
  .dot.move { background:var(--peach); } .dot.booked { background:var(--green); }
  .pill { flex:0 0 auto; font-size:11.5px; font-weight:700; padding:3px 11px; border-radius:999px; margin-top:2px;
          background:#efe9df; color:var(--ink-2); }
  .pill.c-act { background:var(--peach-tint); color:var(--peach-ink); }
  .pill.c-next { background:var(--green-tint); color:var(--green-ink); }
  .pill.c-soon { background:var(--ink); color:var(--white); }

  details { margin-top:6px; }
  summary { cursor:pointer; list-style:none; display:flex; align-items:baseline; gap:8px; font-weight:700; padding:12px 0;
            border-bottom:1px solid var(--rule); }
  summary::-webkit-details-marker { display:none; }
  summary::before { content:"+"; width:12px; color:var(--muted); font-weight:500; }
  details[open] > summary::before { content:"\2212"; }
  .empty { color:var(--muted); padding:12px 0; }

  .stats { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
  .stat { background:var(--cream); border-radius:16px; padding:14px 16px; }
  .stat .n { font-size:30px; line-height:1; font-weight:700; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  .stat .l { font-size:13px; color:var(--ink-2); margin-top:6px; }
  .stat.alert { background:var(--peach-tint); } .stat.alert .n { color:var(--peach-ink); }
  .stat.good { background:var(--green-tint); } .stat.good .n { color:var(--green-ink); }

  .ev { display:flex; align-items:center; gap:14px; padding:10px 0; }
  .date { flex:0 0 46px; height:46px; border-radius:13px; display:flex; flex-direction:column; align-items:center; justify-content:center;
          background:var(--green-tint); color:var(--green-ink); line-height:1; }
  .ev:nth-child(even) .date { background:var(--peach-tint); color:var(--peach-ink); }
  .ev.today .date { background:var(--ink); color:var(--white); }
  .date .d { font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
  .date .mo { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-top:3px; }
  .ev .time { flex:0 0 auto; font-size:13px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }

  @media (max-width:820px) {
    .shell { grid-template-columns:minmax(0,1fr); grid-template-areas:"head" "side" "main"; grid-template-rows:auto; border-radius:22px; }
    .head { padding:26px 20px 22px; }
    .side { padding:24px 20px; }
    .main { padding:0 20px 30px; }
    h1 { font-size:28px; }
    .stats { grid-template-columns:repeat(4, minmax(0,1fr)); }
  }
  @media (max-width:520px) {
    .stats { grid-template-columns:repeat(2, minmax(0,1fr)); }
    .ev { flex-wrap:wrap; }
    .ev .time { flex-basis:100%; padding-left:60px; margin-top:-8px; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="head">
    <h1 id="title">Job Search Dashboard</h1>
    <div class="sub" id="todayLabel"></div>
    <div class="srcnote" id="srcnote"></div>
  </div>

  <div class="main">
    <h2>Needs action from you <span class="cnt" id="cntActions"></span></h2>
    <div class="list" id="actions"></div>

    <h2>Pipeline</h2>
    <details open><summary>Active <span class="cnt" id="cntActive"></span></summary><div id="active"></div></details>
    <details><summary>Gone quiet <span class="cnt" id="cntStale"></span></summary><div id="stale"></div></details>
    <details><summary>Unactioned leads <span class="cnt" id="cntUnclear"></span></summary><div id="unclear"></div></details>
    <details><summary>Closed <span class="cnt" id="cntClosed"></span></summary><div id="closed"></div></details>
  </div>

  <div class="side">
    <h2>At a glance</h2>
    <div class="stats" id="stats"></div>

    <div id="upCard">
      <h2>Coming up</h2>
      <div id="upcoming"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */

// Shown in the header. Change it to whatever you like.
const TITLE = "Job Search Dashboard";

// Date this page was last checked against the real sources (YYYY-MM-DD).
// Everything on the page is a snapshot as of this date.
const SYNCED = "YYYY-MM-DD";

// Where the pipeline data came from, in plain words.
const SOURCES = "email and calendar";

/* ============================================================
   PIPELINE DATA
   Replace everything below with real entries.

   Stages:
     upcoming interviews and deadlines with a date. Anything already in the
              past is hidden automatically when the page is opened.
     actions  things waiting on YOU. The only list that is about your move.
              Its "m" field allows simple inline HTML such as <b> for
              emphasis. Every other field is escaped on render.
     active   live conversations where the ball is in play
     stale    no reply for long enough to need a nudge or a close
     unclear  referrals and leads you never actioned
     closed   rejections, withdrawals, paused roles

   Chips:  ["c-soon","TODAY"]  ["c-act","YOUR MOVE"]
           ["c-next","BOOKED"] ["c-wait","WAITING"] ["c-stale","STALE"]
   The chip also picks the dot colour: orange = your move, green = booked
   or today, grey = waiting or quiet.
   ============================================================ */
const DATA = {
  upcoming: [
    // { when: "2026-01-15T14:00", what: "Company: hiring manager call",
    //   note: "45 min with Name, video link in the invite" }
    // Use "2026-01-15" with no time for an all-day item or a deadline.
  ],
  actions: [
    // { id: "unique-key", t: "What to do", m: "Why it matters, with the date and source.", }
  ],
  active: [
    // { co: "Company", role: "Role title", status: "Where it stands, with a date",
    //   note: "Interviewer names, format, anything useful",
    //   chip: ["c-next","BOOKED"] }
  ],
  stale: [
    // { co: "Company", role: "Role", status: "Last contact and what it was",
    //   note: "How long it has been silent" }
  ],
  unclear: [
    // { co: "Company", role: "", status: "Referral offered by X", note: "Never actioned" }
  ],
  closed: [
    // { co: "Company", role: "Role", status: "Rejected on DATE, reason if given",
    //   note: "Any feedback worth remembering" }
  ]
};

/* ============================================================
   RENDER  (no edits needed below this line)
   ============================================================ */
const STORE_KEY = "jobdash-done-v1";
let done = {};
try { done = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) {}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

document.getElementById("title").textContent = TITLE;
document.getElementById("todayLabel").textContent =
  new Date().toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric", year:"numeric" });

const syncedDate = /^\d{4}-\d{2}-\d{2}$/.test(SYNCED) ? new Date(SYNCED + "T00:00") : null;
const daysOld = syncedDate ? Math.floor((Date.now() - syncedDate.getTime()) / 864e5) : null;
document.getElementById("srcnote").innerHTML =
  "Built from " + esc(SOURCES) + " · last synced <b>" + esc(SYNCED) + "</b>" +
  (daysOld !== null && daysOld > 7
    ? ' · <span class="old">' + daysOld + " days ago, so this may be out of date. Ask Claude to refresh it.</span>"
    : " · ask Claude to refresh anytime");

function renderStats() {
  const open = DATA.actions.filter(a => !done[a.id]).length;
  document.getElementById("cntActions").textContent = open + " open";
  document.getElementById("stats").innerHTML = [
    [open, "Need your move", open ? "alert" : ""],
    [DATA.active.length, "Active", "good"],
    [DATA.stale.length, "Gone quiet", ""],
    [DATA.active.length + DATA.stale.length + DATA.unclear.length, "Total open", ""]
  ].map(s => '<div class="stat ' + s[2] + '"><div class="n">' + s[0] + '</div><div class="l">' + s[1] + '</div></div>').join("");
}

function renderActions() {
  const box = document.getElementById("actions");
  renderStats();
  if (!DATA.actions.length) { box.innerHTML = '<div class="empty">Nothing is waiting on you right now.</div>'; return; }
  box.innerHTML = DATA.actions.map((a, i) =>
    '<label class="task ' + (done[a.id] ? "done" : "") + '">' +
      '<input type="checkbox" id="act-' + i + '" data-id="' + esc(a.id) + '" ' + (done[a.id] ? "checked" : "") + '>' +
      '<div class="body"><div class="t">' + esc(a.t) + '</div><div class="m">' + (a.m || "") + '</div></div>' +
    '</label>').join("");
  box.querySelectorAll("input").forEach(cb => cb.addEventListener("change", e => {
    done[e.target.dataset.id] = e.target.checked;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(done)); } catch (err) {}
    renderActions();
  }));
}
renderActions();

// The chip decides the dot, so colour and label can never disagree.
const DOTS = { "c-act":"move", "c-next":"booked", "c-soon":"booked" };
function rows(list, defaultChip) {
  if (!list.length) return '<div class="empty">Nothing here.</div>';
  return list.map(r => {
    const chip = r.chip || defaultChip || null;
    return '<div class="row">' +
      '<span class="dot ' + ((chip && DOTS[chip[0]]) || "") + '"></span>' +
      '<div class="body">' +
        '<div class="t">' + esc(r.co) + (r.role ? ' <span class="role">' + esc(r.role) + '</span>' : "") + '</div>' +
        '<div class="s">' + esc(r.status) + '</div>' +
        (r.note ? '<div class="m">' + esc(r.note) + '</div>' : "") +
      '</div>' +
      (chip ? '<span class="pill ' + esc(chip[0]) + '">' + esc(chip[1].charAt(0) + chip[1].slice(1).toLowerCase()) + '</span>' : "") +
    '</div>';
  }).join("");
}
document.getElementById("active").innerHTML  = rows(DATA.active);
document.getElementById("stale").innerHTML   = rows(DATA.stale, ["c-stale","STALE"]);
document.getElementById("unclear").innerHTML = rows(DATA.unclear);
document.getElementById("closed").innerHTML  = rows(DATA.closed);
["Active","Stale","Unclear","Closed"].forEach(k => {
  document.getElementById("cnt" + k).textContent = DATA[k.toLowerCase()].length;
});

// Coming up: dated items from the last sync. Past items drop off on their own.
(function () {
  const card = document.getElementById("upCard");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const items = (DATA.upcoming || [])
    .map(u => {
      const allDay = !/T\d/.test(String(u.when));
      return { d: new Date(allDay ? u.when + "T00:00" : u.when), allDay: allDay, what: u.what, note: u.note };
    })
    .filter(u => !isNaN(u.d) && u.d >= today)
    .sort((a, b) => a.d - b.d);

  if (!items.length) { card.hidden = true; return; }

  const fmtTime = d => d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
  document.getElementById("upcoming").innerHTML = items.map(u => {
    const isToday = u.d.toDateString() === new Date().toDateString();
    const when = (isToday ? "Today" : u.d.toLocaleDateString(undefined, { weekday:"short" })) + (u.allDay ? "" : " " + fmtTime(u.d));
    return '<div class="ev ' + (isToday ? "today" : "") + '">' +
      '<div class="date"><span class="d">' + u.d.getDate() + '</span><span class="mo">' +
        esc(u.d.toLocaleDateString(undefined, { month:"short" })) + '</span></div>' +
      '<div class="body"><div class="t">' + esc(u.what) + '</div>' +
      (u.note ? '<div class="m">' + esc(u.note) + '</div>' : "") + '</div>' +
      '<div class="time">' + esc(when) + '</div></div>';
  }).join("");
})();
</script>
</body>
</html>
