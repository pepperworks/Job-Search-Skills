<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Search Dashboard</title>
<style>
  /* One column, summary first: counts, then what is waiting on you, then dates, then the full board. */
  /* One look on purpose: cream in every viewer, light or dark mode. */
  :root {
    color-scheme: light;
    --bg:#fdf8ec; --card:#ffffff; --line:#f0e7d4; --line-soft:#f7f1e3;
    --ink:#3a2c26; --ink-2:#6b5b51; --muted:#93847a; --faint:#b8aca0;
    --accent:#3a2c26; --accent-bg:#f6ecd6; --accent-card:#fff7e3; --accent-line:#f3e6c6;
    --hero-a:#fbf1da; --hero-b:#f8ebcf;
    --green:#3f7a5c; --green-bg:#e3f1e6;
    --amber:#a36f14; --amber-bg:#fbedc8;
    --red:#c2412d; --red-bg:#fbe2da;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45; }
  .wrap { max-width:940px; margin:0 auto; padding-block:20px 60px; padding-inline:18px; }
  .hero { background:linear-gradient(150deg, var(--hero-a), var(--hero-b)); border-radius:18px; padding:18px 20px 16px; margin-bottom:16px; }
  h1 { font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif; font-size:26px; font-weight:800; margin:0 0 2px; letter-spacing:-0.01em; text-wrap:balance; }
  .sub { color:var(--ink-2); font-size:13px; margin-bottom:6px; }
  .srcnote { color:var(--ink-2); font-size:11.5px; }
  .srcnote b { color:var(--ink); }
  .old { color:var(--red); font-weight:600; }
  .demo { display:inline-block; background:var(--card); color:var(--accent); font-size:11.5px; font-weight:700;
          padding:2px 10px; border-radius:999px; margin-bottom:10px; }
  .statrow { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .stat { flex:1; min-width:120px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 16px; }
  .stat .n { font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif; font-size:26px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; }
  .stat .l { font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; font-weight:600; margin-top:2px; }
  .stat.green .n { color:var(--green); } .stat.amber .n { color:var(--amber); } .stat.red .n { color:var(--red); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin:0 0 12px; font-weight:600; }
  .prio-card { background:var(--accent-card); border-color:var(--accent-line); }
  .prio-card h2 { color:var(--accent); }
  .prio-row { display:flex; align-items:flex-start; gap:10px; padding:8px 0; }
  .prio-row:not(:last-child) { border-bottom:1px solid var(--accent-line); }
  .prio-row.done .t { text-decoration:line-through; color:var(--faint); }
  .prio-row input { margin-top:3px; width:16px; height:16px; flex:0 0 auto; cursor:pointer; accent-color:var(--accent); }
  .prio-row input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .prio-row .t { font-weight:500; }
  .prio-row .m { color:var(--muted); font-size:12px; margin-top:1px; }
  .prio-row .m b { color:var(--red); font-weight:600; }
  .co-row { display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft); }
  .co-row:last-child { border-bottom:none; }
  .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; margin-top:6px; }
  .dot.hot { background:var(--accent); } .dot.active { background:var(--green); }
  .dot.waiting { background:var(--amber); } .dot.stale { background:var(--faint); }
  .co-body { flex:1; min-width:0; }
  .co-name { font-weight:600; }
  .co-name .role { font-weight:400; color:var(--ink-2); }
  .co-status { font-size:12.5px; color:var(--ink-2); margin-top:1px; }
  .co-note { font-size:12px; color:var(--muted); margin-top:1px; }
  .chip { font-size:10.5px; padding:1px 8px; border-radius:999px; font-weight:700; letter-spacing:.02em; flex:0 0 auto; margin-top:3px; }
  .c-next { background:var(--green-bg); color:var(--green); }
  .c-act  { background:var(--red-bg); color:var(--red); }
  .c-wait { background:var(--amber-bg); color:var(--amber); }
  .c-stale{ background:var(--line-soft); color:var(--muted); }
  .c-soon { background:var(--accent); color:var(--card); }
  .ev { display:flex; gap:12px; padding:8px 0; border-bottom:1px solid var(--line-soft); flex-wrap:wrap; }
  .ev:last-child { border-bottom:none; }
  .ev > div:last-child { flex:1; min-width:180px; }
  .ev-time { flex:0 0 150px; font-weight:600; color:var(--ink-2); font-variant-numeric:tabular-nums; font-size:13px; }
  .ev-title { font-weight:500; }
  .ev.hit { background:var(--accent-card); margin:0 -8px; padding:8px; border-radius:8px; }
  .empty { color:var(--muted); font-style:italic; }
  details.section { margin-bottom:10px; }
  details.section summary { cursor:pointer; font-weight:700; font-size:14px; padding-bottom:5px;
    border-bottom:2px solid var(--line); margin-bottom:6px; list-style:none; display:flex; align-items:baseline; gap:8px; }
  details.section summary::-webkit-details-marker { display:none; }
  details.section summary::before { content:"▸"; font-size:11px; color:var(--faint); transition:transform .15s; }
  details[open].section summary::before { transform:rotate(90deg); }
  details.section summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  details.section summary .cnt { font-size:12px; color:var(--faint); font-weight:400; margin-left:auto; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1 id="title">Job Search Dashboard</h1>
    <div class="sub" id="todayLabel"></div>
    <div class="srcnote" id="srcnote"></div>
  </div>

  <div class="statrow" id="stats"></div>

  <div class="card prio-card">
    <h2>Needs action from you</h2>
    <div id="actions"></div>
  </div>

  <div class="card" id="upCard">
    <h2>Coming up</h2>
    <div id="upcoming"></div>
  </div>

  <div class="card">
    <h2>Pipeline</h2>
    <details class="section" open><summary>Active <span class="cnt" id="cntActive"></span></summary><div id="active"></div></details>
    <details class="section"><summary>Gone quiet <span class="cnt" id="cntStale"></span></summary><div id="stale"></div></details>
    <details class="section"><summary>Unactioned leads <span class="cnt" id="cntUnclear"></span></summary><div id="unclear"></div></details>
    <details class="section"><summary>Closed <span class="cnt" id="cntClosed"></span></summary><div id="closed"></div></details>
  </div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */

// Shown in the header. Change it to whatever you like.
const TITLE = "Job Search Dashboard";

// Date this page was last checked against the real sources (YYYY-MM-DD).
// Everything on the page is a snapshot as of this date.
const SYNCED = "YYYY-MM-DD";

// Where the pipeline data came from, in plain words.
const SOURCES = "email and calendar";

/* ============================================================
   PIPELINE DATA
   Replace everything below with real entries.

   Stages:
     upcoming interviews and deadlines with a date. Anything already in the
              past is hidden automatically when the page is opened.
     actions  things waiting on YOU. The only list that is about your move.
              Its "m" field allows simple inline HTML such as <b> for
              emphasis. Every other field is escaped on render.
     active   live conversations where the ball is in play
     stale    no reply for long enough to need a nudge or a close
     unclear  referrals and leads you never actioned
     closed   rejections, withdrawals, paused roles

   Chips:  ["c-soon","TODAY"]  ["c-act","YOUR MOVE"]
           ["c-next","BOOKED"] ["c-wait","WAITING"] ["c-stale","STALE"]
   Dots:   hot | active | waiting | stale
   ============================================================ */
const DATA = {
  upcoming: [
    // { when: "2026-01-15T14:00", what: "Company: hiring manager call",
    //   note: "45 min with Name, video link in the invite" }
    // Use "2026-01-15" with no time for an all-day item or a deadline.
  ],
  actions: [
    // { id: "unique-key", t: "What to do", m: "Why it matters, with the date and source.", }
  ],
  active: [
    // { co: "Company", role: "Role title", status: "Where it stands, with a date",
    //   note: "Interviewer names, format, anything useful",
    //   chip: ["c-next","BOOKED"], dot: "hot" }
  ],
  stale: [
    // { co: "Company", role: "Role", status: "Last contact and what it was",
    //   note: "How long it has been silent" }
  ],
  unclear: [
    // { co: "Company", role: "", status: "Referral offered by X", note: "Never actioned" }
  ],
  closed: [
    // { co: "Company", role: "Role", status: "Rejected on DATE, reason if given",
    //   note: "Any feedback worth remembering" }
  ]
};

/* ============================================================
   RENDER  (no edits needed below this line)
   ============================================================ */
const STORE_KEY = "jobdash-done-v1";
let done = {};
try { done = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) {}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
}

document.getElementById("title").textContent = TITLE;
document.getElementById("todayLabel").textContent =
  new Date().toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric", year:"numeric" });
const syncedDate = /^\d{4}-\d{2}-\d{2}$/.test(SYNCED) ? new Date(SYNCED + "T00:00") : null;
const daysOld = syncedDate ? Math.floor((Date.now() - syncedDate.getTime()) / 864e5) : null;
document.getElementById("srcnote").innerHTML =
  "Built from " + esc(SOURCES) + " · last synced <b>" + esc(SYNCED) + "</b>" +
  (daysOld !== null && daysOld > 7
    ? ' · <span class="old">' + daysOld + " days ago, so this may be out of date. Ask Claude to refresh it.</span>"
    : " · ask Claude to refresh anytime");

const openActions = DATA.actions.filter(a => !done[a.id]).length;
document.getElementById("stats").innerHTML = [
  ["green", DATA.active.length, "Active"],
  ["red", openActions, "Need your move"],
  ["amber", DATA.stale.length, "Gone quiet"],
  ["", DATA.active.length + DATA.stale.length + DATA.unclear.length, "Total open"]
].map(s => '<div class="stat ' + s[0] + '"><div class="n">' + s[1] + '</div><div class="l">' + s[2] + '</div></div>').join("");

function renderActions() {
  const box = document.getElementById("actions");
  if (!DATA.actions.length) {
    box.innerHTML = '<span class="empty">Nothing is waiting on you right now.</span>';
    return;
  }
  box.innerHTML = DATA.actions.map(a =>
    '<div class="prio-row ' + (done[a.id] ? "done" : "") + '">' +
      '<input type="checkbox" data-id="' + esc(a.id) + '" ' + (done[a.id] ? "checked" : "") + '>' +
      '<div><div class="t">' + esc(a.t) + '</div><div class="m">' + (a.m || "") + '</div></div>' +
    '</div>').join("");
  box.querySelectorAll("input").forEach(cb => cb.addEventListener("change", e => {
    done[e.target.dataset.id] = e.target.checked;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(done)); } catch (err) {}
    renderActions();
  }));
}
renderActions();

function rows(list, defaultDot, defaultChip) {
  if (!list.length) return '<span class="empty">Nothing here.</span>';
  return list.map(r =>
    '<div class="co-row">' +
      '<div class="dot ' + (r.dot || defaultDot) + '"></div>' +
      '<div class="co-body">' +
        '<div class="co-name">' + esc(r.co) + (r.role ? ' <span class="role">· ' + esc(r.role) + '</span>' : "") + '</div>' +
        '<div class="co-status">' + esc(r.status) + '</div>' +
        (r.note ? '<div class="co-note">' + esc(r.note) + '</div>' : "") +
      '</div>' +
      (r.chip ? '<span class="chip ' + r.chip[0] + '">' + esc(r.chip[1]) + '</span>'
              : (defaultChip ? '<span class="chip ' + defaultChip[0] + '">' + esc(defaultChip[1]) + '</span>' : "")) +
    '</div>').join("");
}
document.getElementById("active").innerHTML  = rows(DATA.active, "active");
document.getElementById("stale").innerHTML   = rows(DATA.stale, "stale", ["c-stale","STALE"]);
document.getElementById("unclear").innerHTML = rows(DATA.unclear, "stale");
document.getElementById("closed").innerHTML  = rows(DATA.closed, "stale");
["Active","Stale","Unclear","Closed"].forEach(k => {
  document.getElementById("cnt" + k).textContent = DATA[k.toLowerCase()].length;
});

// Coming up: dated items from the last sync. Past items drop off on their own.
(function () {
  const card = document.getElementById("upCard");
  const el = document.getElementById("upcoming");
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const items = (DATA.upcoming || [])
    .map(u => {
      const allDay = !/T\d/.test(String(u.when));
      const d = new Date(allDay ? u.when + "T00:00" : u.when);
      return { d: d, allDay: allDay, what: u.what, note: u.note };
    })
    .filter(u => !isNaN(u.d) && u.d >= today)
    .sort((a, b) => a.d - b.d);

  if (!items.length) { card.hidden = true; return; }

  const fmtDay  = d => d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  const fmtTime = d => d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
  el.innerHTML = items.map(u => {
    const isToday = u.d.toDateString() === new Date().toDateString();
    return '<div class="ev ' + (isToday ? "hit" : "") + '">' +
      '<div class="ev-time">' + (isToday ? "Today" : fmtDay(u.d)) + (u.allDay ? "" : ", " + fmtTime(u.d)) + '</div>' +
      '<div><div class="ev-title">' + esc(u.what) + '</div>' +
      (u.note ? '<div class="co-note">' + esc(u.note) + '</div>' : "") + '</div></div>';
  }).join("");
})();
</script>
</body>
</html>
