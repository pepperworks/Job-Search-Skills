<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Dashboard</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         background:#f7f7f5; color:#1f1f1d; font-size:14px; line-height:1.45; }
  .wrap { max-width:940px; margin:0 auto; padding:20px 18px 60px; }
  h1 { font-size:22px; margin:0 0 2px; letter-spacing:-0.01em; }
  .sub { color:#6b6b66; font-size:13px; margin-bottom:6px; }
  .srcnote { color:#a8a8a0; font-size:11.5px; margin-bottom:18px; }
  .statrow { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .stat { flex:1; min-width:120px; background:#fff; border:1px solid #e8e8e4; border-radius:12px; padding:12px 16px; }
  .stat .n { font-size:24px; font-weight:700; letter-spacing:-0.02em; }
  .stat .l { font-size:11.5px; color:#8a8a83; text-transform:uppercase; letter-spacing:0.05em; font-weight:600; margin-top:2px; }
  .stat.green .n { color:#2f7d5b; } .stat.amber .n { color:#b07a1e; } .stat.red .n { color:#b3261e; }
  .card { background:#fff; border:1px solid #e8e8e4; border-radius:12px; padding:16px 18px; margin-bottom:16px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:#8a8a83; margin:0 0 12px; font-weight:600; }
  .prio-card { background:#fffaf2; border-color:#f0e2c8; }
  .prio-card h2 { color:#b07a1e; }
  .prio-row { display:flex; align-items:flex-start; gap:10px; padding:8px 0; }
  .prio-row:not(:last-child) { border-bottom:1px solid #f1e7d4; }
  .prio-row.done .t { text-decoration:line-through; color:#c2b9a6; }
  .prio-row input { margin-top:3px; width:16px; height:16px; flex:0 0 auto; cursor:pointer; accent-color:#b07a1e; }
  .prio-row .t { font-weight:500; }
  .prio-row .m { color:#9a9a92; font-size:12px; margin-top:1px; }
  .prio-row .m b { color:#b3261e; font-weight:600; }
  .co-row { display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid #f4f4f0; }
  .co-row:last-child { border-bottom:none; }
  .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; margin-top:6px; }
  .dot.hot { background:#b3261e; } .dot.active { background:#2f7d5b; }
  .dot.waiting { background:#b07a1e; } .dot.stale { background:#c8c8c0; }
  .co-body { flex:1; min-width:0; }
  .co-name { font-weight:600; }
  .co-name .role { font-weight:400; color:#6b6b63; }
  .co-status { font-size:12.5px; color:#444440; margin-top:1px; }
  .co-note { font-size:12px; color:#9a9a92; margin-top:1px; }
  .chip { font-size:10.5px; padding:1px 8px; border-radius:999px; font-weight:700; letter-spacing:.02em; flex:0 0 auto; margin-top:3px; }
  .c-next { background:#eaf0ea; color:#2f7d5b; }
  .c-act  { background:#fbe4e4; color:#b3261e; }
  .c-wait { background:#fdf0d5; color:#9a6b14; }
  .c-stale{ background:#f1f1ec; color:#8a8a83; }
  .c-soon { background:#1f1f1d; color:#fff; }
  .ev { display:flex; gap:12px; padding:8px 0; border-bottom:1px solid #f0f0ec; }
  .ev:last-child { border-bottom:none; }
  .ev-time { flex:0 0 150px; color:#5a5a52; font-variant-numeric:tabular-nums; font-size:13px; }
  .ev-title { font-weight:500; }
  .ev.hit { background:#fbfaf3; margin:0 -8px; padding:8px; border-radius:8px; }
  .ev.hit .ev-title::after { content:" · PIPELINE"; color:#b3261e; font-size:10.5px; font-weight:700; letter-spacing:.03em; }
  .loading, .empty { color:#9a9a92; font-style:italic; }
  .err { color:#b3261e; font-size:13px; }
  details.section { margin-bottom:10px; }
  details.section summary { cursor:pointer; font-weight:700; font-size:14px; padding-bottom:5px;
    border-bottom:2px solid #ececE6; margin-bottom:6px; list-style:none; display:flex; align-items:baseline; gap:8px; }
  details.section summary::before { content:"▸"; font-size:11px; color:#b0b0a8; transition:transform .15s; }
  details[open].section summary::before { transform:rotate(90deg); }
  details.section summary .cnt { font-size:12px; color:#a8a8a0; font-weight:400; margin-left:auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Job Search Dashboard</h1>
  <div class="sub" id="todayLabel"></div>
  <div class="srcnote" id="srcnote"></div>

  <div class="statrow" id="stats"></div>

  <div class="card prio-card">
    <h2>Needs action from you</h2>
    <div id="actions"></div>
  </div>

  <div class="card" id="calCard">
    <h2>Next 10 days</h2>
    <div id="calendar" class="loading">Loading calendar…</div>
  </div>

  <div class="card">
    <h2>Pipeline</h2>
    <details class="section" open><summary>Active <span class="cnt" id="cntActive"></span></summary><div id="active"></div></details>
    <details class="section"><summary>Gone quiet <span class="cnt" id="cntStale"></span></summary><div id="stale"></div></details>
    <details class="section"><summary>Unactioned leads <span class="cnt" id="cntUnclear"></span></summary><div id="unclear"></div></details>
    <details class="section"><summary>Closed <span class="cnt" id="cntClosed"></span></summary><div id="closed"></div></details>
  </div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */

// Shown in the header. Change it to whatever you like.
const TITLE = "Job Search Dashboard";

// Date this pipeline data was last verified against email and calendar.
// The calendar below is live; everything else is a snapshot as of this date.
const SYNCED = "YYYY-MM-DD";

// Where the pipeline data came from, in plain words.
const SOURCES = "email and calendar";

// Calendar wiring. Leave null and the calendar card hides itself.
// To switch it on, set CALENDAR_TOOL to the fully qualified name of a
// list-events tool available in your environment, and adjust CALENDAR_ARGS
// and readEvents() below to match that tool's request and response shape.
// Verify the shape by calling the tool once before relying on it here.
const CALENDAR_TOOL = null;

// Arguments passed to CALENDAR_TOOL. start/end are filled in at runtime.
function calendarArgs(startISO, endISO) {
  return { startTime: startISO, endTime: endISO, orderBy: "startTime", pageSize: 60 };
}

// Pull a plain array of events out of whatever the tool returned.
// Each event should come back as { summary, start, end } with ISO strings.
function readEvents(raw) {
  const data = raw && (raw.structuredContent
    || (raw.content && raw.content[0] && JSON.parse(raw.content[0].text))
    || raw);
  const list = (data && (data.events || data.items || data)) || [];
  if (!Array.isArray(list)) return [];
  return list
    .filter(ev => ev && ev.status !== "cancelled" && ev.start)
    .map(ev => ({
      summary: ev.summary || ev.title || "(no title)",
      start: ev.start.dateTime || ev.start.date || ev.start,
      end: (ev.end && (ev.end.dateTime || ev.end.date)) || ev.end || null,
      allDay: !!(ev.start && ev.start.date && !ev.start.dateTime)
    }));
}

/* ============================================================
   PIPELINE DATA
   Replace everything below with real entries.

   Stages:
     actions  things waiting on YOU. The only list that is about your move.
              Its "m" field allows simple inline HTML such as <b> for
              emphasis. Every other field is escaped on render.
     active   live conversations where the ball is in play
     stale    no reply for long enough to need a nudge or a close
     unclear  referrals and leads you never actioned
     closed   rejections, withdrawals, paused roles

   Chips:  ["c-soon","TODAY"]  ["c-act","YOUR MOVE"]
           ["c-next","BOOKED"] ["c-wait","WAITING"] ["c-stale","STALE"]
   Dots:   hot | active | waiting | stale
   ============================================================ */
const DATA = {
  actions: [
    // { id: "unique-key", t: "What to do", m: "Why it matters, with the date and source.", }
  ],
  active: [
    // { co: "Company", role: "Role title", status: "Where it stands, with a date",
    //   note: "Interviewer names, format, anything useful",
    //   chip: ["c-next","BOOKED"], dot: "hot" }
  ],
  stale: [
    // { co: "Company", role: "Role", status: "Last contact and what it was",
    //   note: "How long it has been silent" }
  ],
  unclear: [
    // { co: "Company", role: "", status: "Referral offered by X", note: "Never actioned" }
  ],
  closed: [
    // { co: "Company", role: "Role", status: "Rejected on DATE, reason if given",
    //   note: "Any feedback worth remembering" }
  ]
};

/* ============================================================
   RENDER  (no edits needed below this line)
   ============================================================ */
const STORE_KEY = "jobdash-done-v1";
let done = {};
try { done = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) {}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
}

document.getElementById("title").textContent = TITLE;
document.getElementById("todayLabel").textContent =
  new Date().toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric", year:"numeric" });
document.getElementById("srcnote").innerHTML =
  "Pipeline built from " + esc(SOURCES) + " · last synced <b>" + esc(SYNCED) + "</b>" +
  (CALENDAR_TOOL ? " · calendar below is live" : "") +
  " · ask Claude to re-sync anytime";

const openActions = DATA.actions.filter(a => !done[a.id]).length;
document.getElementById("stats").innerHTML = [
  ["green", DATA.active.length, "Active"],
  ["red", openActions, "Need your move"],
  ["amber", DATA.stale.length, "Gone quiet"],
  ["", DATA.active.length + DATA.stale.length + DATA.unclear.length, "Total open"]
].map(s => '<div class="stat ' + s[0] + '"><div class="n">' + s[1] + '</div><div class="l">' + s[2] + '</div></div>').join("");

function renderActions() {
  const box = document.getElementById("actions");
  if (!DATA.actions.length) {
    box.innerHTML = '<span class="empty">Nothing is waiting on you right now.</span>';
    return;
  }
  box.innerHTML = DATA.actions.map(a =>
    '<div class="prio-row ' + (done[a.id] ? "done" : "") + '">' +
      '<input type="checkbox" data-id="' + esc(a.id) + '" ' + (done[a.id] ? "checked" : "") + '>' +
      '<div><div class="t">' + esc(a.t) + '</div><div class="m">' + (a.m || "") + '</div></div>' +
    '</div>').join("");
  box.querySelectorAll("input").forEach(cb => cb.addEventListener("change", e => {
    done[e.target.dataset.id] = e.target.checked;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(done)); } catch (err) {}
    renderActions();
  }));
}
renderActions();

function rows(list, defaultDot, defaultChip) {
  if (!list.length) return '<span class="empty">Nothing here.</span>';
  return list.map(r =>
    '<div class="co-row">' +
      '<div class="dot ' + (r.dot || defaultDot) + '"></div>' +
      '<div class="co-body">' +
        '<div class="co-name">' + esc(r.co) + (r.role ? ' <span class="role">· ' + esc(r.role) + '</span>' : "") + '</div>' +
        '<div class="co-status">' + esc(r.status) + '</div>' +
        (r.note ? '<div class="co-note">' + esc(r.note) + '</div>' : "") +
      '</div>' +
      (r.chip ? '<span class="chip ' + r.chip[0] + '">' + esc(r.chip[1]) + '</span>'
              : (defaultChip ? '<span class="chip ' + defaultChip[0] + '">' + esc(defaultChip[1]) + '</span>' : "")) +
    '</div>').join("");
}
document.getElementById("active").innerHTML  = rows(DATA.active, "active");
document.getElementById("stale").innerHTML   = rows(DATA.stale, "stale", ["c-stale","STALE"]);
document.getElementById("unclear").innerHTML = rows(DATA.unclear, "stale");
document.getElementById("closed").innerHTML  = rows(DATA.closed, "stale");
["Active","Stale","Unclear","Closed"].forEach(k => {
  document.getElementById("cnt" + k).textContent = DATA[k.toLowerCase()].length;
});

// Company names from the pipeline, used to highlight matching calendar events.
const PIPELINE_NAMES = []
  .concat(DATA.active, DATA.stale, DATA.unclear)
  .map(r => String(r.co || "").toLowerCase())
  .filter(Boolean);

(async () => {
  const card = document.getElementById("calCard");
  const el = document.getElementById("calendar");

  if (!CALENDAR_TOOL) { card.style.display = "none"; return; }

  const bridge = (typeof window !== "undefined" && window.cowork && window.cowork.callMcpTool)
    ? window.cowork.callMcpTool : null;
  if (!bridge) {
    el.className = "";
    el.innerHTML = '<span class="empty">No calendar bridge in this viewer. ' +
                   'Open the dashboard where its tools are available, or leave CALENDAR_TOOL null to hide this card.</span>';
    return;
  }

  try {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const end = new Date(start.getTime() + 10 * 864e5);
    const raw = await bridge(CALENDAR_TOOL, calendarArgs(start.toISOString(), end.toISOString()));
    const events = readEvents(raw)
      .filter(e => e.start)
      .sort((a, b) => String(a.start).localeCompare(String(b.start)));

    if (!events.length) { el.className = ""; el.innerHTML = '<span class="empty">Nothing in the next 10 days.</span>'; return; }

    const fmtDay  = d => d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
    const fmtTime = d => d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
    let html = "", lastDay = "";
    for (const ev of events) {
      const s = new Date(ev.start);
      const day = fmtDay(s);
      if (day !== lastDay) {
        html += '<div style="font-size:12px;font-weight:600;color:#8a8a83;margin:8px 0 2px">' + day + '</div>';
        lastDay = day;
      }
      const low = ev.summary.toLowerCase();
      const hit = PIPELINE_NAMES.some(n => low.includes(n));
      const time = ev.allDay ? "all-day" : fmtTime(s) + (ev.end ? "–" + fmtTime(new Date(ev.end)) : "");
      html += '<div class="ev ' + (hit ? "hit" : "") + '"><div class="ev-time">' + time + '</div>' +
              '<div><div class="ev-title">' + esc(ev.summary) + '</div></div></div>';
    }
    el.className = ""; el.innerHTML = html;
  } catch (e) {
    el.className = "";
    el.innerHTML = '<div class="err">Could not load the calendar: ' + esc(e && e.message ? e.message : e) + '</div>';
  }
})();
</script>
</body>
</html>
